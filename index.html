<style>
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#fff;overflow:hidden;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#fff;font-weight:600;color:#667085}

  #btnExplode{position:fixed;left:16px;top:16px;z-index:10;padding:9px 14px;border:1px solid #e1e4e8;border-radius:10px;background:rgba(255,255,255,.95);color:#1f2933;font:600 13.5px/1 "Segoe UI",system-ui,sans-serif;box-shadow:0 4px 14px rgba(15,23,42,.08);cursor:pointer}
  #btnExplode:hover{border-color:#c7cfdd;background:#f7f9fc}
  #btnExplode[aria-pressed="true"]{background:#2563eb;border-color:#2563eb;color:#fff}
  #btnExplode:focus-visible,#infoClose:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
  #info{position:fixed;right:16px;top:16px;z-index:10;width:320px;max-height:calc(100vh - 32px);overflow:auto;padding:15px 17px;border:1px solid #e1e4e8;border-radius:14px;background:rgba(255,255,255,.96);color:#14171f;box-shadow:0 8px 30px rgba(20,23,31,.1)}

  #infoClose:hover{background:#f2f4f7;color:#14171f}
  #info .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#eef2ff;color:#3730a3}
  #info h2{margin:8px 28px 4px 0;font-size:18px;line-height:1.25}
  #info{transition:opacity .25s ease,transform .25s ease}

  #info .tip{margin-top:10px;padding:8px 11px;border-radius:10px;background:#fff7e6;border:1px solid #fde3a7;font-size:13px;color:#5c4100}
  @media (max-width:820px){#info{left:12px;right:12px;top:62px;width:auto;max-height:42vh}#btnExplode{left:12px;top:12px}}

  #notes{position:fixed;left:16px;bottom:16px;z-index:10;display:flex;flex-direction:column;gap:8px;max-width:min(430px,calc(100vw - 32px));pointer-events:none}
  .note{padding:9px 13px;border-radius:9px;font-size:13.5px;line-height:1.45;background:rgba(255,255,255,.93);color:#1f2933;border:1px solid #e1e4e8;box-shadow:0 4px 14px rgba(15,23,42,.08)}
  .note-info b{color:#2563eb}

  .note-warn b{color:#b45309}
  .note-warn.pulse{animation:notePulse .45s ease 2}
  @keyframes notePulse{50%{transform:translateX(6px);box-shadow:0 0 0 3px rgba(245,158,11,.4)}}
  @media (max-width:520px){#notes{left:10px;bottom:10px}.note{font-size:12.5px;padding:8px 11px}}

  #scopeView{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#0d0f12;color:#e6e9ee;animation:svIn .18s ease-out}

  .sv-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid #22262d;background:#121418}
  .sv-title{display:flex;align-items:center;gap:12px;min-width:0}
  .sv-title h1{margin:0;font:600 18px/1.2 "Segoe UI",system-ui,sans-serif;color:#e6e9ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #svClose{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid #333944;border-radius:8px;background:#1b1f25;color:#e6e9ee;font:600 14px/1 "Segoe UI",system-ui,sans-serif;cursor:pointer}
  #svClose:hover{background:#262b33;border-color:#4a515d}
  #svClose:focus-visible{outline:2px solid #3fa9ff;outline-offset:2px}
  .sv-body{flex:1;display:flex;gap:18px;padding:18px 20px;min-height:0}

  .sv-scale{display:flex;flex-wrap:wrap;gap:6px 18px;padding:9px 14px;border-top:1px solid #1f3a2b;font:600 12.5px/1.3 Consolas,"Courier New",monospace;color:#9ccfb2;background:#08170f}

  .sv-card{border:1px solid #262b33;border-radius:9px;background:#14171c;padding:10px 12px}

  .sv-ch-name{font:700 13.5px/1.2 "Segoe UI",system-ui,sans-serif}
  .sv-ch-tog{font-size:11px;color:#8b93a0}
  .sv-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}

  .sv-note{font-size:13px;line-height:1.5;color:#c9cfd8}
  .sv-lead{color:#e6e9ee}

  .sv-step + .sv-lead{margin-top:10px;padding-top:8px;border-top:1px solid #23272e}
  .sv-formula{margin-top:6px;padding:7px 10px;border-radius:6px;background:#0f1216;border-left:3px solid #3fa9ff;font:700 13.5px/1.4 Consolas,"Courier New",monospace;color:#f2f4f7}
  .sv-tag{font:800 15px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.04em;padding:7px 10px;border-radius:6px;background:#2a2f37;color:#fff}
  @media (max-width:820px){
    .sv-body{flex-direction:column;overflow:auto}
    .sv-screen{flex:none;height:56vh}
    .sv-side{width:auto}
    .sv-head{padding:12px 16px}
    .sv-title h1{font-size:16px}
  }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ===== Renderer y escena ===== */

const PIX_MAX = Math.min(devicePixelRatio, 2);
const PIX_MIN = 1.25;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(PIX_MAX);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const EXPOSURE = { day: 0.92, on: 0.56 };
renderer.toneMappingExposure = EXPOSURE.day;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#f7f8fa');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ===== Cámara y controles ===== */

const camera =new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 400);
const HOME = { pos: new THREE.Vector3(0, 16.5, 20.5), target: new THREE.Vector3(0, -0.6, 0) };
camera.position.copy(HOME.pos);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.dampingFactor = 0.09;
controls.minDistance = 1.2;
controls.maxDistance = 55;
controls.maxPolarAngle = Math.PI * 0.49;
controls.zoomToCursor = true;
controls.screenSpacePanning = true;
controls.zoomSpeed = 1.1;
controls.rotateSpeed = 0.6;
controls.panSpeed = 1.0;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN };
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

const LIM = { x: [-16, 16], y: [-1.5, 6], z: [-10, 10] };
function clampTarget() {
  const t = controls.target;
  t.x = THREE.MathUtils.clamp(t.x, LIM.x[0], LIM.x[1]);
  t.y = THREE.MathUtils.clamp(t.y, LIM.y[0], LIM.y[1]);
  t.z = THREE.MathUtils.clamp(t.z, LIM.z[0], LIM.z[1]);
}

/* ===== Luces ===== */

scene.add(new THREE.HemisphereLight('#ffffff', '#e9dcc8', 0.53));
const sun = new THREE.DirectionalLight('#fff4e6', 2.0);
sun.position.set(6.6, 21, 14.4);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 18, bottom: -18, near: 1, far: 90 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 3;
sun.shadow.autoUpdate = false;
sun.shadow.needsUpdate = true;
scene.add(sun);
const fill = new THREE.DirectionalLight('#dfe8ff', 0.42);
fill.position.set(-16, 9, -8);
scene.add(fill);

/* ===== Utilidades ===== */

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const std = (color, roughness = 0.5, metalness = 0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });

function mesh(geo, mat, cast = true, receive = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  m.receiveShadow = receive;
  return m;
}

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function decal(tex, w, h) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.6, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }));
  return m;
}

/* ===== Coordenadas de la protoboard ===== */

const P = 0.254;
const BOARD_TOP = 0.85;
const colX = c => (c - 32) * P;
const ROWZ = {
  a: -1.416, b: -1.162, c: -0.908, d: -0.654, e: -0.4, f: 0.4, g: 0.654, h: 0.908, i: 1.162, j: 1.416,
  'B-': 2.0, 'B+': 2.254, 'T+': -2.0, 'T-': -2.254,
};
const holePos = (col, row) => V(colX(col), BOARD_TOP, ROWZ[row]);

/* ===== Mesa ===== */

const TABLE_W = 32;
const TABLE_D = 20;

function buildTable() {
  const wood = canvasTex(2048, 1024, (x, w, h) => {
    x.fillStyle = '#c8935b';
    x.fillRect(0, 0, w, h);
    for (let i = 0; i < 420; i++) {
      const y = Math.random() * h;
      x.strokeStyle = Math.random() < 0.8
        ? `rgba(95,55,22,${0.04 + Math.random() * 0.1})`
        : `rgba(255,225,180,${0.06 + Math.random() * 0.08})`;
      x.lineWidth = 1 + Math.random() * 3.5;
      x.beginPath();
      for (let px = 0; px <= w; px += 16) x.lineTo(px, y + Math.sin(px * 0.004 + i) * 7 + Math.sin(px * 0.017 + i * 2) * 2);
      x.stroke();
    }
  });
  const g = new THREE.Group();
  const top = mesh(new THREE.BoxGeometry(TABLE_W, 0.8, TABLE_D), std('#ffffff', 0.62, 0, { map: wood, bumpMap: wood, bumpScale: 0.035 }), false);
  top.position.set(0, -0.4, 0);
  g.add(top);

  const legMat = std('#8d5f36', 0.6);
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      const leg = mesh(new THREE.BoxGeometry(0.9, 12, 0.9), legMat);
      leg.position.set(sx * (TABLE_W / 2 - 1.2), -6.8, sz * (TABLE_D / 2 - 1.2));
      g.add(leg);
    }
  }

  const radial = (inner, a0, a1) => canvasTex(256, 256, (x, w, h) => {
    const gr = x.createRadialGradient(w / 2, h / 2, w * inner, w / 2, h / 2, w / 2);
    gr.addColorStop(0, `rgba(0,0,0,${a0})`);
    gr.addColorStop(0.55, `rgba(0,0,0,${a1})`);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr;
    x.fillRect(0, 0, w, h);
  });

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(TABLE_W + 18, TABLE_D + 14),
    new THREE.MeshBasicMaterial({ map: radial(0.04, 0.18, 0.08), transparent: true, depthWrite: false }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, -12.8, 0);
  g.add(floor);

  const contact = new THREE.Mesh(new THREE.PlaneGeometry(19, 7.5),
    new THREE.MeshBasicMaterial({ map: radial(0.12, 0.4, 0.14), transparent: true, depthWrite: false }));
  contact.rotation.x = -Math.PI / 2;
  contact.position.set(0, 0.012, 0);
  contact.renderOrder = -1;
  g.add(contact);
  return g;
}

/* ===== Protoboard ===== */

function buildBoard() {
  const g = new THREE.Group();
  const BX = -0.2;
  const body = mesh(new RoundedBoxGeometry(16.9, 0.85, 5.3, 4, 0.08), std('#eeede7', 0.82, 0, { envMapIntensity: 0.55 }));
  body.position.set(BX, 0.425, 0);
  g.add(body);

  const BW = 16.74, BD = 5.14, S = 230;
  const tex = canvasTex(Math.round(BW * S), Math.round(BD * S), (x, w, h) => {
    const toC = (px, pz) => [(px - BX + BW / 2) * S, (pz + BD / 2) * S];
    x.fillStyle = '#efeee8';
    x.fillRect(0, 0, w, h);

    x.fillStyle = '#e3e3db';
    x.fillRect(0, toC(0, -0.15)[1], w, 0.3 * S);
    x.fillStyle = '#cfcfc6';
    x.fillRect(0, toC(0, -0.15)[1], w, 3);
    x.fillRect(0, toC(0, 0.15)[1] - 3, w, 3);

    const RD = '#e0413a', BL = '#2f66d8', BR = '#8a5a2b';
    const hline = (z, col) => {
      x.fillStyle = col;
      x.fillRect(toC(-8.45, 0)[0], (z + BD / 2) * S - 0.018 * S, 16.45 * S, 0.036 * S);
    };
    hline(-1.76, BR);
    hline(-2.48, BL);
    hline(1.76, BR);
    hline(2.48, RD);

    const holeAt = (px, pz) => {
      const [u, v] = toC(px, pz), s = 0.1 * S;
      x.fillStyle = '#cdcdc5';
      x.fillRect(u - s / 2 - 3, v - s / 2 - 3, s + 6, s + 6);
      x.fillStyle = '#2b2b2b';
      x.fillRect(u - s / 2, v - s / 2, s, s);
      x.fillStyle = '#5a5a5a';
      x.fillRect(u - s / 2, v - s / 2, s, 4);
    };
    for (let c = 1; c <= 63; c++) {
      for (const r of 'abcdefghij') holeAt(colX(c), ROWZ[r]);
      if (c % 6 !== 0) for (const r of ['B+', 'B-', 'T+', 'T-']) holeAt(colX(c), ROWZ[r]);
    }

    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.font = `600 ${0.13 * S}px Arial`;
    x.fillStyle = '#8a8a84';
    for (const r of 'abcdefghij') {
      x.fillText(r, ...toC(-8.1, ROWZ[r]));
      x.fillText(r, ...toC(8.1, ROWZ[r]));
    }
    x.font = `600 ${0.11 * S}px Arial`;
    for (const c of [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60]) {
      x.fillText(String(c), ...toC(colX(c), -1.6));
      x.fillText(String(c), ...toC(colX(c), 1.6));
    }

    const labelX = -8.36;
    x.font = `700 ${0.14 * S}px Arial`;
    x.fillStyle = RD;
    x.fillText('+9 V', ...toC(labelX, ROWZ['B+']));
    x.fillStyle = BL;
    x.fillText('−9 V', ...toC(labelX, ROWZ['T-']));

    const groundSymbol = (px, pz) => {
      const [u, v] = toC(px, pz);
      x.strokeStyle = BR;
      x.lineWidth = 0.016 * S;
      x.lineCap = 'round';
      const seg = (x1, y1, x2, y2) => {
        x.beginPath();
        x.moveTo(u + x1 * S, v + y1 * S);
        x.lineTo(u + x2 * S, v + y2 * S);
        x.stroke();
      };
      seg(0, -0.085, 0, -0.02);
      seg(-0.07, -0.02, 0.07, -0.02);
      seg(-0.045, 0.015, 0.045, 0.015);
      seg(-0.02, 0.05, 0.02, 0.05);
    };
    groundSymbol(labelX, ROWZ['B-']);
    groundSymbol(labelX, ROWZ['T+']);
  });
  const top = mesh(new THREE.PlaneGeometry(BW, BD), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, envMapIntensity: 0.55 }), false);
  top.rotation.x = -Math.PI / 2;
  top.position.set(BX, BOARD_TOP + 0.0015, 0);
  g.add(top);

  const brandTex = canvasTex(2048, 112, (x, w) => {
    const a = 'UNA PIEZA ORIGINAL DE';
    const b = 'SÁNCHEZ PROGRAMEITOR';
    const fa = '500 38px "Segoe UI", Arial, sans-serif';
    const fb = '800 46px "Segoe UI", Arial, sans-serif';
    const spacing = s => { if ('letterSpacing' in x) x.letterSpacing = s; };
    x.font = fa; spacing('5px');
    const wa = x.measureText(a).width;
    x.font = fb; spacing('7px');
    const wb = x.measureText(b).width;
    const gap = 34, start = (w - (wa + gap + wb)) / 2, mid = 58;
    x.textAlign = 'left';
    x.textBaseline = 'middle';
    x.font = fa; spacing('5px'); x.fillStyle = '#9a9a93';
    x.fillText(a, start, mid);
    x.font = fb; spacing('7px'); x.fillStyle = '#7a7a73';
    x.fillText(b, start + wa + gap, mid);
  });
  const brand = decal(brandTex, 8.4, 8.4 * 112 / 2048);
  brand.position.set(0, 0.425, 2.652);
  g.add(brand);
  return g;
}

/* ===== Componentes ===== */

const LEG_METAL = std('#a9adb4', 0.38, 0.75);

function buildIC(pinCount, label, first) {
  const half = pinCount / 2;
  const last = first + half - 1;
  const g = new THREE.Group();

  const BODY_L = 1.95, BODY_W = 0.66, BODY_H = 0.33, LIFT = 0.04;
  const bodyY = BOARD_TOP + LIFT + BODY_H / 2;
  const cx = (colX(first) + colX(last)) / 2;

  const body = mesh(new RoundedBoxGeometry(BODY_L, BODY_H, BODY_W, 3, 0.03), std('#232427', 0.5, 0.05));
  body.position.set(cx, bodyY, 0);
  g.add(body);

  const S = 600;
  const tex = canvasTex(Math.round(BODY_L * S), Math.round(BODY_W * S), (x, w, h) => {
    x.clearRect(0, 0, w, h);
    x.fillStyle = '#08080a';
    x.beginPath();
    x.arc(0, h / 2, 0.1 * S, -Math.PI / 2, Math.PI / 2);
    x.fill();
    x.strokeStyle = '#46484e';
    x.lineWidth = 3;
    x.stroke();
    x.fillStyle = '#4a4c52';
    x.beginPath();
    x.arc(0.24 * S, h - 0.14 * S, 0.035 * S, 0, Math.PI * 2);
    x.fill();
    x.fillStyle = '#d4d7dd';
    x.font = `700 ${0.2 * S}px Arial`;
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText(label, w * 0.55, h / 2);
  });
  const mark = decal(tex, BODY_L, BODY_W);
  mark.rotation.x = -Math.PI / 2;
  mark.position.set(cx, bodyY + BODY_H / 2 + 0.0015, 0);
  g.add(mark);

  const legW = 0.06, legT = 0.026;
  const shoulderY = BOARD_TOP + LIFT + 0.09;
  const bottomY = BOARD_TOP - 0.1;
  const parts = [];
  for (let n = 1; n <= pinCount; n++) {
    const front = n <= half;
    const p = holePos(front ? first + n - 1 : last - (n - half - 1), front ? 'f' : 'e');
    const dir = front ? 1 : -1;

    const shoulder = new THREE.BoxGeometry(legW, legT, 0.12);
    shoulder.translate(p.x, shoulderY, p.z - dir * 0.05);
    parts.push(shoulder);

    const drop = new THREE.BoxGeometry(legW, shoulderY - bottomY, legT);
    drop.translate(p.x, (shoulderY + bottomY) / 2, p.z);
    parts.push(drop);
  }
  const legs = mesh(mergeGeometries(parts), LEG_METAL);
  g.add(legs);
  return g;
}
const BAND_HEX = {
  black: '#141414', brown: '#6b3410', red: '#c42b1c', orange: '#e8761c', yellow: '#e8c61c',
  green: '#2f8f3a', blue: '#2a55c4', violet: '#7a3fa8', gray: '#8a8d92', white: '#f1f1ee',
  gold: '#c9a227', silver: '#b9bcc2',
};
const DIGIT_COLORS = ['black', 'brown', 'red', 'orange', 'yellow', 'green', 'blue', 'violet', 'gray', 'white'];
const bandMats = {};
const bandMat = name => bandMats[name] || (bandMats[name] = std(BAND_HEX[name], name === 'gold' || name === 'silver' ? 0.35 : 0.6, name === 'gold' || name === 'silver' ? 0.6 : 0));

function bandColors(ohms, tolerance = 'gold') {
  const exp = Math.floor(Math.log10(ohms)) - 1;
  const mant = Math.round(ohms / 10 ** exp);
  const mult = exp === -1 ? 'gold' : exp === -2 ? 'silver' : DIGIT_COLORS[exp];
  return [DIGIT_COLORS[Math.floor(mant / 10)], DIGIT_COLORS[mant % 10], mult, tolerance];
}

const RES = { HALF: 0.315, R_MID: 0.1, R_END: 0.122, BEVEL: 0.1, CAP: 0.05, WIRE: 0.02, SEG: 72 };

function resRadiusAt(y) {
  const ay = Math.abs(y);
  const base = RES.R_MID + (RES.R_END - RES.R_MID) * THREE.MathUtils.smoothstep(ay, RES.HALF - RES.BEVEL, RES.HALF - RES.CAP);
  const k = Math.max(0, (ay - (RES.HALF - RES.CAP)) / RES.CAP);
  return base * Math.sqrt(Math.max(0, 1 - k * k));
}

function buildResistorBody(ohms) {
  const g = new THREE.Group();
  const profile = [];
  for (let i = 0; i <= 80; i++) {
    const y = -RES.HALF + (2 * RES.HALF * i) / 80;
    profile.push(new THREE.Vector2(Math.max(0.0005, resRadiusAt(y)), y));
  }
  g.add(mesh(new THREE.LatheGeometry(profile, RES.SEG), std('#dcbd86', 0.5, 0)));

  const offsets = [0.215, 0.13, 0.045, -0.2];
  const BAND_W = 0.05;
  bandColors(ohms).forEach((name, i) => {
    const ring = [];
    for (let s = 0; s <= 12; s++) {
      const t = s / 12;
      const y = offsets[i] - BAND_W / 2 + BAND_W * t;
      ring.push(new THREE.Vector2(resRadiusAt(y) + 0.0012 + 0.0035 * Math.pow(Math.sin(Math.PI * t), 0.5), y));
    }
    g.add(mesh(new THREE.LatheGeometry(ring, RES.SEG), bandMat(name), false));
  });
  return g;
}

function buildResistorStanding(ohms, a, b) {
  const g = new THREE.Group();
  const bodyBottom = BOARD_TOP + 0.05;
  const bodyY = bodyBottom + RES.HALF;
  const bodyTop = bodyY + RES.HALF;
  const bottomY = BOARD_TOP - 0.1;

  const body = buildResistorBody(ohms);
  body.position.set(a.x, bodyY, a.z);
  g.add(body);

  const legA = mesh(new THREE.CylinderGeometry(RES.WIRE, RES.WIRE, bodyBottom + 0.12 - bottomY, 20), LEG_METAL);
  legA.position.set(a.x, (bodyBottom + 0.12 + bottomY) / 2, a.z);
  g.add(legA);

  const arch = bodyTop + 0.075;
  const path = roundedPath([
    V(a.x, bodyTop - 0.1, a.z), V(a.x, arch, a.z), V(b.x, arch, b.z), V(b.x, bottomY, b.z),
  ], 0.07);
  g.add(mesh(new THREE.TubeGeometry(path, 200, RES.WIRE, 20, false), LEG_METAL, true, false));
  return g;
}

function buildResistor(ohms, row, colA, colB) {
  return buildResistorStanding(ohms, holePos(colA, row), holePos(colB, row));
}

function buildResistorLaid(ohms, a, b, compact = false) {
  const g = new THREE.Group();
  const mid = V((a.x + b.x) / 2, 0, (a.z + b.z) / 2);
  const axis = V(b.x - a.x, 0, b.z - a.z).normalize();
  if (Math.abs(axis.x) > Math.abs(axis.z) ? axis.x < 0 : axis.z < 0) axis.negate();
  const axisY = BOARD_TOP + RES.R_END + 0.02;
  const bottomY = BOARD_TOP - 0.1;

  const body = buildResistorBody(ohms);
  body.quaternion.setFromUnitVectors(V(0, 1, 0), axis);
  body.position.set(mid.x, axisY, mid.z);
  g.add(body);

  for (const p of [a, b]) {
    if (compact) {
      const pin = mesh(new THREE.CylinderGeometry(RES.WIRE, RES.WIRE, axisY - bottomY, 20), LEG_METAL, true, false);
      pin.position.set(p.x, (axisY + bottomY) / 2, p.z);
      g.add(pin);
      continue;
    }
    const outward = V(p.x - mid.x, 0, p.z - mid.z).normalize();
    const tip = mid.clone().addScaledVector(outward, RES.HALF - 0.04);
    const path = roundedPath([V(p.x, bottomY, p.z), V(p.x, axisY, p.z), V(tip.x, axisY, tip.z)], 0.07);
    g.add(mesh(new THREE.TubeGeometry(path, 120, RES.WIRE, 20, false), LEG_METAL, true, false));
  }
  return g;
}

function buildResistorFlat(ohms, row, colA, colB) {
  return buildResistorLaid(ohms, holePos(colA, row), holePos(colB, row));
}

function buildResistorToRail(ohms, col, row, rail, railCol) {
  const g = new THREE.Group();
  const a = holePos(col, row), r = holePos(col, rail), b = holePos(railCol, rail);
  const axisY = BOARD_TOP + RES.R_END + 0.02;
  const bottomY = BOARD_TOP - 0.1;

  const body = buildResistorBody(ohms);
  body.quaternion.setFromUnitVectors(V(0, 1, 0), V(0, 0, Math.sign(r.z - a.z)));
  body.position.set(a.x, axisY, (a.z + r.z) / 2);
  g.add(body);

  const pin = mesh(new THREE.CylinderGeometry(RES.WIRE, RES.WIRE, axisY - bottomY, 20), LEG_METAL, true, false);
  pin.position.set(a.x, (axisY + bottomY) / 2, a.z);
  g.add(pin);

  const path = roundedPath([V(a.x, axisY, r.z), V(b.x, axisY, b.z), V(b.x, bottomY, b.z)], 0.06);
  g.add(mesh(new THREE.TubeGeometry(path, 80, RES.WIRE, 20, false), LEG_METAL, true, false));
  return g;
}

function buildResistorBent(ohms, a, b, z = a.z) {
  const g = new THREE.Group();
  const midX = (a.x + b.x) / 2;
  const axisY = BOARD_TOP + RES.R_END + 0.02;
  const bottomY = BOARD_TOP - 0.1;

  const body = buildResistorBody(ohms);
  body.quaternion.setFromUnitVectors(V(0, 1, 0), V(1, 0, 0));
  body.position.set(midX, axisY, z);
  g.add(body);

  for (const p of [a, b]) {
    const tipX = midX + Math.sign(p.x - midX) * (RES.HALF - 0.04);
    const pts = [V(p.x, bottomY, p.z), V(p.x, axisY, p.z), V(p.x, axisY, z), V(tipX, axisY, z)]
      .filter((q, i, arr) => i === 0 || q.distanceTo(arr[i - 1]) > 1e-6);
    const path = roundedPath(pts, 0.06);
    g.add(mesh(new THREE.TubeGeometry(path, 120, RES.WIRE, 20, false), LEG_METAL, true, false));
  }
  return g;
}

const LED_HEX = { red: '#e3261b', green: '#22b14c', blue: '#2a63f0' };

function buildLED(color, anode, cathode) {
  const g = new THREE.Group();
  const R = 0.19, BODY_H = 0.36, FL_R = 0.225, FL_H = 0.08;
  const c = V((anode.x + cathode.x) / 2, 0, (anode.z + cathode.z) / 2);
  const dir = V(cathode.x - anode.x, 0, cathode.z - anode.z).normalize();
  const baseY = BOARD_TOP + 0.55;
  const kneeY = BOARD_TOP + 0.06;
  const bottomY = BOARD_TOP - 0.1;

  const lens = std(LED_HEX[color], 0.18, 0, { transparent: true, opacity: 0.86, emissive: LED_HEX[color], emissiveIntensity: 0 });
  lens.userData = { keepEmissive: true, isLens: true };
  const profile = [new THREE.Vector2(0.0005, 0)];
  for (let i = 0; i <= 8; i++) profile.push(new THREE.Vector2(R, (BODY_H * i) / 8));
  for (let i = 1; i <= 24; i++) {
    const a = (Math.PI / 2) * (i / 24);
    profile.push(new THREE.Vector2(Math.max(0.0005, R * Math.cos(a)), BODY_H + R * Math.sin(a)));
  }
  const body = mesh(new THREE.LatheGeometry(profile, 48), lens);
  body.position.set(c.x, baseY + FL_H, c.z);
  g.add(body);

  const cut = FL_R * 0.82;
  const shape = new THREE.Shape();
  const a0 = Math.acos(cut / FL_R);
  shape.absarc(0, 0, FL_R, a0, Math.PI * 2 - a0, false);
  shape.lineTo(cut, FL_R * Math.sin(a0));
  const flangeGeo = new THREE.ExtrudeGeometry(shape, { depth: FL_H, bevelEnabled: false, curveSegments: 40 });
  flangeGeo.rotateX(-Math.PI / 2);
  const flange = mesh(flangeGeo, lens);
  flange.rotation.y = -Math.atan2(dir.z, dir.x);
  flange.position.set(c.x, baseY, c.z);
  g.add(flange);

  const frame = std('#5d6068', 0.4, 0.7);
  const across = V(-dir.z, 0, dir.x);
  const anvil = mesh(new THREE.BoxGeometry(0.09, 0.26, 0.025), frame, false);
  anvil.position.copy(c).addScaledVector(dir, 0.07).setY(baseY + 0.2);
  anvil.rotation.y = Math.atan2(across.x, across.z);
  const post = mesh(new THREE.BoxGeometry(0.04, 0.3, 0.025), frame, false);
  post.position.copy(c).addScaledVector(dir, -0.08).setY(baseY + 0.22);
  post.rotation.y = anvil.rotation.y;
  g.add(anvil, post);

  for (const [hole, s] of [[anode, -1], [cathode, 1]]) {
    const top = c.clone().addScaledVector(dir, s * P / 2);
    const path = roundedPath([
      V(top.x, baseY + 0.2, top.z), V(top.x, kneeY, top.z), V(hole.x, kneeY, hole.z), V(hole.x, bottomY, hole.z),
    ], 0.05);
    g.add(mesh(new THREE.TubeGeometry(path, 120, RES.WIRE, 16, false), LEG_METAL, true, false));
  }
  const head = V(c.x, baseY + FL_H + BODY_H * 0.7, c.z);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: HALO_TEX, color: LED_HEX[color], transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
  }));
  halo.scale.setScalar(1.5);
  halo.position.copy(head);
  halo.visible = false;
  g.add(halo);
  const light = new THREE.PointLight(LED_HEX[color], 0, 2.4, 2);
  light.position.copy(head).setY(head.y - 0.05);
  g.add(light);
  g.userData.led = { halo, light };
  return g;
}

const HALO_TEX = canvasTex(128, 128, (x, w, h) => {
  const gr = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,0.9)');
  gr.addColorStop(0.25, 'rgba(255,255,255,0.35)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr;
  x.fillRect(0, 0, w, h);
});

function buildCeramic(code, a, b, z = a.z) {
  const g = new THREE.Group();
  const R = 0.19, T = 0.048;
  const PITCH = Math.abs(b.x - a.x) <= P + 1e-6 ? Math.abs(b.x - a.x) : 0.2;
  const cx = (a.x + b.x) / 2;
  const cy = BOARD_TOP + 0.4 + R;
  const kneeY = BOARD_TOP + 0.28;
  const bottomY = BOARD_TOP - 0.1;
  const coat = std('#c8742c', 0.55, 0);

  const profile = [new THREE.Vector2(0.0005, T)];
  for (let i = 0; i <= 16; i++) {
    const ang = Math.PI / 2 - Math.PI * (i / 16);
    profile.push(new THREE.Vector2(R - T + T * Math.cos(ang), T * Math.sin(ang)));
  }
  profile.push(new THREE.Vector2(0.0005, -T));
  const discGeo = new THREE.LatheGeometry(profile, 56);
  discGeo.rotateX(Math.PI / 2);
  const disc = mesh(discGeo, coat);
  disc.position.set(cx, cy, z);
  g.add(disc);

  const tex = canvasTex(256, 128, (x, w, h) => {
    x.clearRect(0, 0, w, h);
    x.fillStyle = '#3a2412';
    x.font = '700 70px Arial';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText(code, w / 2, h / 2);
  });
  for (const side of [1, -1]) {
    const label = decal(tex, 0.21, 0.105);
    label.position.set(cx, cy + 0.015, z + side * (T + 0.002));
    if (side < 0) label.rotation.y = Math.PI;
    g.add(label);
  }

  for (const p of [a, b]) {
    const s = Math.sign(p.x - cx) || 1;
    const top = V(cx + s * PITCH / 2, cy - R + 0.06, z);
    const drip = mesh(new THREE.CylinderGeometry(0.03, 0.025, 0.09, 16), coat);
    drip.position.set(top.x, cy - R + 0.015, z);
    g.add(drip);
    const pts = [top, V(top.x, kneeY, z), V(top.x, kneeY, p.z), V(p.x, kneeY, p.z), V(p.x, bottomY, p.z)]
      .filter((q, i, arr) => i === 0 || q.distanceTo(arr[i - 1]) > 1e-6);
    g.add(mesh(new THREE.TubeGeometry(roundedPath(pts, 0.06), 160, RES.WIRE, 16, false), LEG_METAL, true, false));
  }
  return g;
}

function buildElectrolytic(value, minus, plus) {
  const g = new THREE.Group();
  const R = 0.2, H = 0.7, PITCH = 0.2;
  const bodyBottom = BOARD_TOP + 0.44;
  const kneeY = BOARD_TOP + 0.34;
  const bottomY = BOARD_TOP - 0.1;
  const d = V(plus.x - minus.x, 0, plus.z - minus.z).normalize();
  const c = V((minus.x + plus.x) / 2, 0, (minus.z + plus.z) / 2);

  const S = 420;
  const tex = canvasTex(Math.round(2 * Math.PI * R * S), Math.round(H * S), (x, w, h) => {
    x.fillStyle = '#1c1d22';
    x.fillRect(0, 0, w, h);
    const sw = w * 0.15;
    x.fillStyle = '#c3c6cc';
    x.fillRect(w * 0.25 - sw / 2, 0, sw, h);
    x.fillStyle = '#1c1d22';
    for (let i = 0; i < 5; i++) x.fillRect(w * 0.25 - sw * 0.22, h * (0.16 + i * 0.17), sw * 0.44, h * 0.03);
    x.fillStyle = '#d6d8dc';
    x.font = `600 ${0.085 * S}px Arial`;
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    for (const cx of [0, w / 2, w]) x.fillText(value, cx, h * 0.48);
  });
  tex.wrapS = THREE.RepeatWrapping;

  const profile = [new THREE.Vector2(0.0005, 0), new THREE.Vector2(R - 0.012, 0)];
  for (let i = 1; i <= 40; i++) {
    const y = (H - 0.03) * (i / 40);
    const groove = Math.exp(-(((y - 0.14) / 0.018) ** 2)) * 0.012;
    profile.push(new THREE.Vector2(R - groove, y));
  }
  for (let i = 1; i <= 8; i++) {
    const a = (Math.PI / 2) * (i / 8);
    profile.push(new THREE.Vector2(R - 0.03 + 0.03 * Math.cos(a), H - 0.03 + 0.03 * Math.sin(a)));
  }
  profile.push(new THREE.Vector2(R - 0.035, H));
  const body = mesh(new THREE.LatheGeometry(profile, 64), std('#ffffff', 0.38, 0, { map: tex }));
  body.position.set(c.x, bodyBottom, c.z);
  body.rotation.y = Math.atan2(d.z, -d.x);
  g.add(body);

  const topTex = canvasTex(256, 256, (x, w, h) => {
    const gr = x.createRadialGradient(w * 0.4, h * 0.4, 10, w / 2, h / 2, w / 2);
    gr.addColorStop(0, '#e4e6ea');
    gr.addColorStop(1, '#9fa3aa');
    x.fillStyle = gr;
    x.fillRect(0, 0, w, h);
    x.strokeStyle = '#6f737a';
    x.lineWidth = 6;
    x.beginPath();
    x.moveTo(w * 0.5, h * 0.18); x.lineTo(w * 0.5, h * 0.82);
    x.moveTo(w * 0.18, h * 0.5); x.lineTo(w * 0.82, h * 0.5);
    x.stroke();
  });
  const top = mesh(new THREE.CircleGeometry(R - 0.034, 48), std('#ffffff', 0.3, 0.75, { map: topTex }), false);
  top.rotation.x = -Math.PI / 2;
  top.position.set(c.x, bodyBottom + H - 0.004, c.z);
  g.add(top);

  for (const [hole, s] of [[minus, -1], [plus, 1]]) {
    const top = c.clone().addScaledVector(d, s * PITCH / 2);
    const path = roundedPath([
      V(top.x, bodyBottom + 0.05, top.z), V(top.x, kneeY, top.z), V(hole.x, kneeY, hole.z), V(hole.x, bottomY, hole.z),
    ], 0.06);
    g.add(mesh(new THREE.TubeGeometry(path, 160, RES.WIRE, 16, false), LEG_METAL, true, false));
  }
  return g;
}

const WIRE_HEX = { brown: '#7b4a22', red: '#c4302b', orange: '#ec6208', black: '#232326', blue: '#2a62d8', green: '#1f9d4f' };
const wireMats = {};
const wireMat = name => wireMats[name] || (wireMats[name] = std(WIRE_HEX[name], 0.42, 0));

function roundedPath(points, radius) {
  const path = new THREE.CurvePath();
  let cursor = points[0].clone();
  for (let i = 1; i < points.length - 1; i++) {
    const p = points[i];
    const dirIn = p.clone().sub(points[i - 1]);
    const dirOut = points[i + 1].clone().sub(p);
    const r = Math.min(radius, dirIn.length() / 2, dirOut.length() / 2);
    const start = p.clone().addScaledVector(dirIn.normalize(), -r);
    const end = p.clone().addScaledVector(dirOut.normalize(), r);
    path.add(new THREE.LineCurve3(cursor, start));
    path.add(new THREE.QuadraticBezierCurve3(start, p.clone(), end));
    cursor = end;
  }
  path.add(new THREE.LineCurve3(cursor, points[points.length - 1].clone()));
  return path;
}

function buildJumper(colA, rowA, colB, rowB, color, rise = 0.11, via = []) {
  const g = new THREE.Group();
  const a = holePos(colA, rowA);
  const b = holePos(colB, rowB);
  const SHEATH = 0.032, PIN = 0.016, BASE = 0.012;
  const hTop = BOARD_TOP + rise;
  const y0 = BOARD_TOP + BASE;
  const bottomY = BOARD_TOP - 0.1;

  const plan = [a, ...via.map(v => (Array.isArray(v) ? holePos(...v) : v)), b];
  const points = [V(a.x, y0, a.z), ...plan.map(p => V(p.x, hTop, p.z)), V(b.x, y0, b.z)];
  const path = roundedPath(points, rise > 0.3 ? 0.16 : 0.06);
  g.add(mesh(new THREE.TubeGeometry(path, 160, SHEATH, 20, false), wireMat(color), true, false));

  for (const p of [a, b]) {
    const pin = mesh(new THREE.CylinderGeometry(PIN, PIN, y0 + 0.02 - bottomY, 16), LEG_METAL);
    pin.position.set(p.x, (y0 + 0.02 + bottomY) / 2, p.z);
    g.add(pin);
  }
  return g;
}

/* ===== Fuente ===== */

function bindingPost(color) {
  const g = new THREE.Group();
  const mat = std(color, 0.35, 0.05);
  const ring = mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.05, 32), std('#1b1c1f', 0.6));
  ring.rotation.x = Math.PI / 2;
  ring.position.z = 0.025;
  g.add(ring);
  const base = mesh(new THREE.CylinderGeometry(0.115, 0.125, 0.12, 6), mat);
  base.rotation.x = Math.PI / 2;
  base.position.z = 0.11;
  g.add(base);
  const cap = mesh(new THREE.CylinderGeometry(0.1, 0.115, 0.13, 32), mat);

    x.fillText('FUENTE DC', ...toP(-1.42, 0.68));
    x.fillStyle = '#8b9099';
    x.font = `600 ${0.08 * PS}px "Segoe UI", Arial, sans-serif`;
    x.fillText('FIJA 9 V', ...toP(-0.62, 0.68));

    ROWS.forEach((ry, i) => {
      const [lx, ly] = toP(-1.4, ry + 0.2);
      const lw = 1.65 * PS, lh = 0.4 * PS;
      x.fillStyle = on ? '#0b0f0c' : '#090a0b';
      x.fillRect(lx, ly, lw, lh);
      x.strokeStyle = '#454a52';
      x.lineWidth = 4;
      x.strokeRect(lx, ly, lw, lh);
      if (on) {
        x.fillStyle = '#58f08a';
        x.shadowColor = 'rgba(88,240,138,0.6)';
        x.shadowBlur = 12;
        x.textAlign = 'right';
        x.font = `700 ${0.3 * PS}px Consolas, "Courier New", monospace`;
        x.fillText('9.00', lx + lw - 0.42 * PS, ly + lh / 2 + 2);
        x.font = `700 ${0.17 * PS}px Consolas, "Courier New", monospace`;
        x.fillText('V', lx + lw - 0.14 * PS, ly + lh / 2 + 4);
        x.shadowBlur = 0;
      }
      x.textAlign = 'left';
      x.fillStyle = '#8b9099';
      x.font = `600 ${0.075 * PS}px "Segoe UI", Arial, sans-serif`;
      x.fillText(`SALIDA ${i + 1}`, lx + 0.06 * PS, ly + 0.08 * PS);

      x.textAlign = 'center';
      x.font = `700 ${0.13 * PS}px Arial`;
      x.fillStyle = '#e0413a';
      x.fillText('+', ...toP(0.72, ry + 0.25));
      x.fillStyle = '#d6d8dc';
      x.fillText('−', ...toP(1.17, ry + 0.25));
    });

    const [ex, ey] = toP(LED.x, LED.y);
    x.fillStyle = on ? '#58f08a' : '#2a3a30';
    if (on) {
      x.shadowColor = 'rgba(88,240,138,0.9)';
      x.shadowBlur = 14;
    }
    x.beginPath();
    x.arc(ex, ey, 0.035 * PS, 0, Math.PI * 2);
    x.fill();
    x.shadowBlur = 0;
  });
  const panels = { on: drawPanel(true), off: drawPanel(false) };
  const face = decal(panels.off, PW, PH);
  face.position.set(0, cy, D / 2 + 0.042);

  const label = (text, color) => canvasTex(256, 112, (x, w, h) => {

  pBase.position.z = 0.02;
  power.add(pBase);
  const pCap = mesh(new RoundedBoxGeometry(BW, BH, 0.1, 4, 0.04), std('#3b4048', 0.45, 0.15));
  pCap.position.z = 0.09;
  power.add(pCap);
  const pFace = decal(labels.off, BW - 0.08, (BW - 0.08) * 112 / 256);
  pFace.position.z = 0.141;
  power.add(pFace);
  const PX = 1.05;
  power.position.set(PX, cy + LED.y, D / 2 + 0.04);
  power.userData.power = true;
  g.add(power);
  g.userData.powerButton = power;
  g.userData.setPower = on => {
    face.material.map = on ? panels.on : panels.off;
    pFace.material.map = on ? labels.on : labels.off;
    face.material.needsUpdate = true;
    pFace.material.needsUpdate = true;
  };

  g.position.set(-12.2, 0, -6.2);
  g.userData.posts = {};
  ROWS.forEach((ry, i) => {
    for (const [px, color, sign] of [[0.72, '#c4302b', '+'], [1.17, '#1d1e21', '-']]) {
      const post = bindingPost(color);
      post.position.set(px, cy + ry, D / 2 + 0.04);
      g.add(post);
      g.userData.posts[`${i + 1}${sign}`] = post.position.clone().add(g.position).setZ(g.position.z + D / 2 + 0.04 + 0.336);
    }
  });
  return g;
}

const LEAD_HEX = { red: '#c4302b', black: '#1f2023', signal: '#e6b422', green: '#1f9d4f' };

function buildLead(tip, col, row, color, dropZ, route, board = null) {
  const g = new THREE.Group();
  const mat = std(LEAD_HEX[color], 0.5, 0);
  const R = 0.04, PIN = 0.016;
  const h = holePos(col, row);

  const plug = mesh(new THREE.CylinderGeometry(0.075, 0.065, 0.34, 24), mat);
  plug.rotation.x = Math.PI / 2;
  plug.position.set(tip.x, tip.y, tip.z + 0.1);
  g.add(plug);
  const grip = mesh(new THREE.CylinderGeometry(0.055, 0.075, 0.18, 24), mat);
  grip.rotation.x = Math.PI / 2;
  grip.position.set(tip.x, tip.y, tip.z + 0.35);
  g.add(grip);

  const floorY = R + 0.002;
  const over = BOARD_TOP + 0.13;
  const s = board ? Math.sign(tip.z) : Math.sign(h.z);
  const edgeOut = s * (2.65 + 0.14);
  const surfY = BOARD_TOP + R + 0.004;
  const entryX = board ? board[0][0] : h.x;
  const points = [
    V(tip.x, tip.y, tip.z + 0.44),
    V(tip.x, tip.y, dropZ),
    V(tip.x, floorY, dropZ),
    ...route.map(([x, z]) => V(x, floorY, z)),
    V(entryX, floorY, edgeOut),
    ...(board
      ? [V(entryX, surfY, edgeOut), ...board.map(([x, z]) => V(x, surfY, z)), V(h.x, surfY + 0.08, h.z)]
      : [V(h.x, over, edgeOut), V(h.x, over, h.z)]),
    V(h.x, BOARD_TOP + 0.03, h.z),
  ];
  const path = roundedPath(points, 0.12);
  g.add(mesh(new THREE.TubeGeometry(path, 320, R, 14, false), mat, true, false));

  const sleeve = mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.14, 16), mat);
  sleeve.position.set(h.x, BOARD_TOP + 0.08, h.z);
  g.add(sleeve);
  const pin = mesh(new THREE.CylinderGeometry(PIN, PIN, 0.14, 12), LEG_METAL);
  pin.position.set(h.x, BOARD_TOP - 0.05, h.z);
  g.add(pin);
  return g;
}

const GEN_FREQS = [
  { f: 90, label: '90 Hz', cycles: 1 },
  { f: 500, label: '500 Hz', cycles: 2.5 },
  { f: 3000, label: '3 kHz', cycles: 6 },
];
const GEN_VP = 3;

function buildFunctionGenerator() {
  const g = new THREE.Group();
  const W = 3.6, H = 1.75, D = 2.0, FOOT = 0.06;
  const cy = FOOT + H / 2;
  const fz = D / 2 + 0.04;

  const body = mesh(new RoundedBoxGeometry(W, H, D, 4, 0.1), std('#c9ccd1', 0.45, 0.35));
  body.position.y = cy;
  g.add(body);

  const bezel = mesh(new RoundedBoxGeometry(W - 0.12, H - 0.12, 0.06, 3, 0.03), std('#26292e', 0.55, 0.1));
  bezel.position.set(0, cy, D / 2 + 0.01);
  g.add(bezel);

  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      const foot = mesh(new THREE.CylinderGeometry(0.13, 0.15, FOOT, 20), std('#1a1a1a', 0.9));
      foot.position.set(sx * (W / 2 - 0.35), FOOT / 2, sz * (D / 2 - 0.3));
      g.add(foot);
    }
  }

  const PW = W - 0.2, PH = H - 0.2, PS = 260;
  const left = -PW / 2;
  const SIG_X = left + 0.38, GND_X = SIG_X + 2 * P, POST_Y = -0.5;
  const LCD = { x: -0.42, y: 0.16, w: 2.3, h: 0.66 };
  const BTN_X = 1.2;

  const panel = canvasTex(Math.round(PW * PS), Math.round(PH * PS), (x, w, h) => {
    const toP = (px, py) => [(px + PW / 2) * PS, (PH / 2 - py) * PS];
    x.fillStyle = '#26292e';
    x.fillRect(0, 0, w, h);
    x.textBaseline = 'middle';
    x.fillStyle = '#c7cbd2';
    x.textAlign = 'left';
    x.font = `700 ${0.1 * PS}px "Segoe UI", Arial, sans-serif`;
    x.fillText('GENERADOR DE FUNCIONES', ...toP(left + 0.12, 0.64));

    x.textAlign = 'center';
    x.font = `700 ${0.075 * PS}px "Segoe UI", Arial, sans-serif`;
    x.fillStyle = '#f5d742';
    x.fillText('SALIDA', ...toP(SIG_X, -0.29));
    x.fillStyle = '#5fcf8a';
    x.fillText('TIERRA', ...toP(GND_X, -0.29));
    x.fillStyle = '#8b9099';
    x.font = `600 ${0.07 * PS}px "Segoe UI", Arial, sans-serif`;
    x.fillText('FRECUENCIA', ...toP(BTN_X, 0.64));
    x.textAlign = 'right';
    x.fillText(`AMPLITUD ${GEN_VP} Vp`, ...toP(LCD.x + LCD.w / 2, -0.5));
  });
  const face = decal(panel, PW, PH);
  face.position.set(0, cy, D / 2 + 0.042);
  g.add(face);

  const LS = 300;
  const lcdCanvas = document.createElement('canvas');
  lcdCanvas.width = Math.round(LCD.w * LS);
  lcdCanvas.height = Math.round(LCD.h * LS);
  const lcdTex = new THREE.CanvasTexture(lcdCanvas);
  lcdTex.colorSpace = THREE.SRGBColorSpace;
  lcdTex.anisotropy = 8;
  const drawLCD = sel => {
    const x = lcdCanvas.getContext('2d'), w = lcdCanvas.width, h = lcdCanvas.height;
    x.fillStyle = '#0b0f0c';
    x.fillRect(0, 0, w, h);
    const wl = 0.06 * LS, ww = w * 0.56 - wl, mid = h / 2, amp = h * 0.3;
    x.strokeStyle = 'rgba(120,200,150,0.18)';
    x.lineWidth = 2;
    x.beginPath();
    x.moveTo(wl, mid);
    x.lineTo(wl + ww, mid);
    x.stroke();
    x.strokeStyle = '#f5d742';
    x.lineWidth = 5;
    x.shadowColor = '#f5d742';
    x.shadowBlur = 10;
    x.beginPath();
    for (let k = 0; k <= 200; k++) {
      const u = k / 200;
      const yv = mid - Math.sin(u * Math.PI * 2 * sel.cycles) * amp;
      if (k === 0) x.moveTo(wl + u * ww, yv); else x.lineTo(wl + u * ww, yv);
    }
    x.stroke();
    x.shadowBlur = 0;
    x.fillStyle = '#e8ebef';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.font = `700 ${0.2 * LS}px Consolas, "Courier New", monospace`;
    x.fillText(sel.label, w * 0.79, mid - 0.08 * LS);
    x.fillStyle = 'rgba(160,230,190,0.75)';
    x.font = `600 ${0.1 * LS}px Consolas, "Courier New", monospace`;
    x.fillText(`SENO · ${GEN_VP} Vp`, w * 0.79, mid + 0.14 * LS);
    lcdTex.needsUpdate = true;
  };
  const lcdFrame = mesh(new RoundedBoxGeometry(LCD.w + 0.1, LCD.h + 0.1, 0.04, 3, 0.02), std('#121315', 0.6));
  lcdFrame.position.set(LCD.x, cy + LCD.y, D / 2 + 0.06);
  g.add(lcdFrame);
  const lcd = new THREE.Mesh(new THREE.PlaneGeometry(LCD.w, LCD.h), new THREE.MeshBasicMaterial({ map: lcdTex, toneMapped: false }));
  lcd.position.set(LCD.x, cy + LCD.y, D / 2 + 0.082);
  g.add(lcd);

  g.userData.buttons = [];
  GEN_FREQS.forEach((sel, i) => {
    const b = scopeButton(sel.label);
    delete b.userData.stage;
    b.userData.freq = sel.f;
    b.position.set(BTN_X + 0.1, cy + 0.36 - i * 0.42, fz);
    const lamp = mesh(new THREE.SphereGeometry(0.035, 16, 10), std('#2a2d31', 0.4, 0, { emissive: '#000000' }), false);
    lamp.material.userData.keepEmissive = true;
    lamp.position.set(-0.44, 0, 0.03);
    b.add(lamp);
    b.userData.lamp = lamp;
    g.add(b);
    g.userData.buttons.push(b);
  });

  g.userData.select = f => {
    const sel = GEN_FREQS.find(s => s.f === f);
    drawLCD(sel);
    g.userData.buttons.forEach(b => {
      const m = b.userData.lamp.material;
      const on = b.userData.freq === f;
      m.color.set(on ? '#7dffa8' : '#2a2d31');
      m.emissive.set(on ? '#3dff7f' : '#000000');
      m.emissiveIntensity = on ? 1.4 : 0;
    });
  };

  g.position.set(colX(9) - SIG_X, 0, -6.2);
  g.userData.posts = {};
  for (const [key, px, color] of [['sig', SIG_X, '#e6b422'], ['gnd', GND_X, '#1f9d4f']]) {
    const post = bindingPost(color);
    post.position.set(px, cy + POST_Y, D / 2 + 0.04);
    g.add(post);
    g.userData.posts[key] = post.position.clone().add(g.position).setZ(g.position.z + D / 2 + 0.04 + 0.336);
  }
  return g;
}

    x.moveTo(...toP(CTRL_X - 0.75, 0.16));

  });
  const face = decal(panel, PW, PH);

    bg.addColorStop(1, '#06120c');
    x.fillStyle = bg;
    x.fillRect(0, 0, w, h);
    const cols = 10, rows = 8, m = 0.06 * SS;
    const gw = w - 2 * m, gh = h - 2 * m;
    x.strokeStyle = 'rgba(120,200,150,0.18)';

    for (let i = 0; i <= cols; i++) {

      x.moveTo(m + (gw * i) / cols, m);
      x.lineTo(m + (gw * i) / cols, h - m);
      x.stroke();
    }
    for (let j = 0; j <= rows; j++) {
      x.beginPath();
      x.moveTo(m, m + (gh * j) / rows);

    x.shadowBlur = 10;
    x.lineWidth = 3;
    x.beginPath();
    x.moveTo(m, h / 2);
    x.lineTo(w - m, h / 2);
    x.stroke();
    x.shadowBlur = 0;
    x.fillStyle = 'rgba(160,230,190,0.75)';
    x.font = `600 ${0.075 * SS}px Consolas, "Courier New", monospace`;

function addPart(meta, ...objects) {
  const g = new THREE.Group();
  objects.forEach(o => g.add(o));
  const cache = new Map();
  const swap = m => { if (!cache.has(m.uuid)) cache.set(m.uuid, m.clone()); return cache.get(m.uuid); };
  g.traverse(o => {
    if (!o.isMesh) return;
    o.material = Array.isArray(o.material) ? o.material.map(swap) : swap(o.material);
    o.userData.partId = meta.id;
    pickables.push(o);
  });
  const part = { explode: 0, tip: '', ...meta, group: g };
  PARTS.push(part);
  partById[meta.id] = part;
  scene.add(g);
  return part;
}

/* ===== Pantalla del osciloscopio ===== */

const COLOR_IN = '#f5d742', COLOR_OUT = '#3fa9ff';

const STAGE_VIEW = {};

const sv = {
  root: document.getElementById('scopeView'),
  tag: document.getElementById('svTag'),
  title: document.getElementById('svTitle'),
  canvas: document.getElementById('svCanvas'),
  scale: document.getElementById('svScale'),
  side: document.getElementById('svSide'),
  close: document.getElementById('svClose'),
};
const svCtx = sv.canvas.getContext('2d');
let svStage = null, svHidden = [], svRaf = 0, svLast = 0;

const fmt = (v, d = 2) => v.toLocaleString('es-CO', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtV = v => `${fmt(v)} V`;
const fmtF = f => (f >= 1000 ? `${fmt(f / 1000)} kHz` : `${fmt(f, 0)} Hz`);
const fmtT = t => (t >= 1e-3 ? `${fmt(t * 1e3)} ms` : `${fmt(t * 1e6, 0)} µs`);
const sample = (ch, t) => (ch.wave ? ch.wave(t) : ch.amp * Math.sin(2 * Math.PI * ch.f * t + ch.phase));

function waveStats(ch) {
  if (!ch.wave) return { hi: ch.amp, lo: -ch.amp, rms: ch.amp / Math.SQRT2 };
  const period = 1 / ch.f, N = 20000;
  let hi = -Infinity, lo = Infinity, sq = 0;
  for (let k = 0; k < N; k++) {
    const v = ch.wave((k / N) * period);
    hi = Math.max(hi, v);
    lo = Math.min(lo, v);
    sq += v * v;
  }
  return { hi, lo, rms: Math.sqrt(sq / N) };
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function buildSide(view) {
  sv.side.replaceChildren();

  const probes = el('div', 'sv-card sv-probes');
  probes.append(el('h2', '', 'Dónde se conecta'));
  view.channels.forEach(ch => {
    const line = el('div', 'sv-probe');
    const dot = el('span', 'sv-dot');
    dot.style.background = ch.color;
    const label = el('b', '', `${ch.name.split('· ')[1]}:`);
    label.style.color = ch.color;
    line.append(dot, label, document.createTextNode(` ${ch.probe}`));
    probes.append(line);
  });
  sv.side.append(probes);

  view.channels.forEach((ch, i) => {
    const card = el('div', 'sv-card sv-ch');
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-pressed', 'true');
    card.style.borderLeft = `3px solid ${ch.color}`;
    const head = el('div', 'sv-ch-head');
    const name = el('div', 'sv-ch-name', ch.name);
    name.style.color = ch.color;
    const tog = el('span', 'sv-ch-tog', 'Ocultar');
    head.append(name, tog);
    const grid = el('div', 'sv-grid');
    const add = (k, v) => {
      const cell = el('div', 'sv-cell');
      cell.append(el('span', '', k), el('b', '', v));
      grid.append(cell);
    };
    const st = ch.stats;
    add('Vp', fmtV(Math.max(st.hi, -st.lo)));
    add('Vpp', fmtV(st.hi - st.lo));
    add('Vrms', fmtV(st.rms));
    add('Frecuencia', ch.f ? fmtF(ch.f) : '—');
    card.append(head, grid);
    const toggle = () => {
      svHidden[i] = !svHidden[i];
      card.classList.toggle('off', svHidden[i]);
      card.setAttribute('aria-pressed', String(!svHidden[i]));
      tog.textContent = svHidden[i] ? 'Mostrar' : 'Ocultar';
    };
    card.addEventListener('click', toggle);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    sv.side.append(card);
  });

  const note = el('div', 'sv-card');
  note.append(el('h2', '', 'Qué está pasando'));
  if (typeof view.note === 'string') {
    note.append(el('div', 'sv-note', view.note));
  } else {
    view.note.forEach(item => {
      const step = el('div', item.title ? 'sv-step' : 'sv-note sv-lead');
      if (item.title) step.append(el('b', '', item.title), el('div', 'sv-note', item.text));
      else step.textContent = item.text;
      if (item.formula) step.append(el('div', 'sv-formula', item.formula));
      note.append(step);
    });
  }
  sv.side.append(note);
}

function buildScale(view) {
  sv.scale.replaceChildren();
  view.channels.forEach((ch, i) => {
    const s = el('span', '', '');
    const b = el('b', '', `CH${i + 1}`);
    b.style.color = ch.color;
    s.append(b, ` ${fmt(view.vdiv, view.vdiv < 1 ? 1 : 0)} V/div`);
    sv.scale.append(s);
  });
  sv.scale.append(el('span', '', `${fmtT(view.tdiv)}/div`), el('span', '', `Disparo: ${view.trigger || 'CH1'} ${view.edge || '↑'} 0 V`));
}

function drawScope(now) {
  svRaf = requestAnimationFrame(drawScope);
  if (now - svLast < 33) return;
  svLast = now;
  const view = STAGE_VIEW[svStage];
  const dpr = Math.min(devicePixelRatio, 2);
  const cw = sv.canvas.clientWidth, chh = sv.canvas.clientHeight;
  if (sv.canvas.width !== Math.round(cw * dpr) || sv.canvas.height !== Math.round(chh * dpr)) {
    sv.canvas.width = Math.round(cw * dpr);
    sv.canvas.height = Math.round(chh * dpr);
  }
  const x = svCtx;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, cw, chh);

  const COLS = 10, ROWS = 8, m = 28;
  const gw = cw - 2 * m, gh = chh - 2 * m;
  const divW = gw / COLS, divH = gh / ROWS;
  const cx0 = m, cy0 = m + gh / 2;

  x.strokeStyle = 'rgba(120,200,150,0.14)';
  x.lineWidth = 1;
  x.beginPath();
  for (let i = 0; i <= COLS; i++) { x.moveTo(m + i * divW, m); x.lineTo(m + i * divW, m + gh); }
  for (let j = 0; j <= ROWS; j++) { x.moveTo(m, m + j * divH); x.lineTo(m + gw, m + j * divH); }
  x.stroke();
  x.strokeStyle = 'rgba(120,200,150,0.32)';
  x.beginPath();
  x.moveTo(m + gw / 2, m); x.lineTo(m + gw / 2, m + gh);
  x.moveTo(m, cy0); x.lineTo(m + gw, cy0);
  for (let i = 0; i <= COLS * 5; i++) { const px = m + (i * divW) / 5; x.moveTo(px, cy0 - 4); x.lineTo(px, cy0 + 4); }
  for (let j = 0; j <= ROWS * 5; j++) { const py = m + (j * divH) / 5; x.moveTo(m + gw / 2 - 4, py); x.lineTo(m + gw / 2 + 4, py); }
  x.stroke();

  x.font = '600 11px Consolas, "Courier New", monospace';
  x.fillStyle = 'rgba(156,207,178,0.75)';
  x.textBaseline = 'middle';
  x.textAlign = 'right';
  for (let j = 0; j <= ROWS; j++) {
    const v = (ROWS / 2 - j) * view.vdiv;
    x.fillText(`${fmt(v, 0)}`, m - 6, m + j * divH);
  }

  const yOf = v => cy0 - (v / view.vdiv) * divH;
  const tStart = -view.tdiv;
  const tSpan = COLS * view.tdiv;

  const marked = ch => ch.stats.hi - ch.stats.lo > 0.1;

  view.channels.forEach((ch, i) => {
    if (svHidden[i] || !marked(ch)) return;
    x.save();
    x.setLineDash([6, 6]);
    x.strokeStyle = ch.color;
    x.globalAlpha = 0.45;
    x.lineWidth = 1;
    x.beginPath();
    for (const v of [ch.stats.hi, ch.stats.lo]) { x.moveTo(m, yOf(v)); x.lineTo(m + gw, yOf(v)); }
    x.stroke();
    x.restore();
  });

  view.channels.forEach((ch, i) => {
    if (svHidden[i]) return;
    x.save();
    x.strokeStyle = ch.color;
    x.lineWidth = ch.width || 2.2;
    x.shadowColor = ch.color;
    x.shadowBlur = 10;
    x.beginPath();
    const N = Math.max(400, Math.round(gw));
    const jitter = (Math.random() - 0.5) * tSpan * 0.0015;
    for (let k = 0; k <= N; k++) {
      const t = tStart + (k / N) * tSpan + jitter;
      const v = sample(ch, t) + (Math.random() - 0.5) * 0.02 * Math.max(1, ch.stats.hi);
      const px = m + (k / N) * gw, py = yOf(v);
      if (k === 0) x.moveTo(px, py); else x.lineTo(px, py);
    }
    x.stroke();
    x.restore();
  });

  const visible = view.channels.map((ch, i) => ({ ch, i })).filter(o => !svHidden[o.i] && marked(o.ch));
  visible.forEach(({ ch }, n) => {
    const bx = m + gw - 18 - n * 74;
    const top = yOf(ch.stats.hi), bot = yOf(ch.stats.lo);
    x.strokeStyle = ch.color;
    x.lineWidth = 1.5;
    x.beginPath();
    x.moveTo(bx - 6, top); x.lineTo(bx + 6, top);
    x.moveTo(bx, top); x.lineTo(bx, bot);
    x.moveTo(bx - 6, bot); x.lineTo(bx + 6, bot);
    x.stroke();
    const label = `Vpp ${fmt(ch.stats.hi - ch.stats.lo)} V`;
    x.font = '700 11.5px Consolas, "Courier New", monospace';
    const tw = x.measureText(label).width;
    const ly = (top + bot) / 2;
    x.fillStyle = 'rgba(6,18,12,0.85)';
    x.fillRect(bx - tw - 12, ly - 9, tw + 8, 18);
    x.fillStyle = ch.color;
    x.textAlign = 'right';
    x.fillText(label, bx - 8, ly);

    x.textAlign = 'left';
    const pl = `+Vp ${fmt(ch.stats.hi)} V`;
    const pw = x.measureText(pl).width;
    const px = m + 8 + n * 118;
    x.fillStyle = 'rgba(6,18,12,0.85)';
    x.fillRect(px - 4, top - 19, pw + 8, 16);
    x.fillStyle = ch.color;
    x.fillText(pl, px, top - 11);
  });

  x.fillStyle = 'rgba(245,215,66,0.9)';
  const trigX = m + divW;
  x.beginPath();
  x.moveTo(trigX - 6, m - 12); x.lineTo(trigX + 6, m - 12); x.lineTo(trigX, m - 4);
  x.fill();
  x.font = '600 11px Consolas, "Courier New", monospace';
  x.textAlign = 'left';
  x.fillStyle = 'rgba(156,207,178,0.75)';
  x.fillText('T', trigX + 9, m - 10);
}

function openScope(stage) {
  const view = STAGE_VIEW[stage];
  if (!view) return;
  svStage = stage;
  svHidden = view.channels.map(() => false);
  view.channels.forEach(ch => { ch.stats = ch.stats || waveStats(ch); });
  sv.tag.textContent = stage;
  sv.title.textContent = view.title;
  buildSide(view);
  buildScale(view);
  sv.root.hidden = false;
  controls.enabled = false;
  svLast = 0;
  svRaf = requestAnimationFrame(drawScope);
  sv.close.focus();
}

function closeScope() {
  if (!svStage) return;
  cancelAnimationFrame(svRaf);
  sv.root.hidden = true;
  svStage = null;
  controls.enabled = true;
  needsRender = true;
  canvas.focus?.();
}

sv.close.addEventListener('click', closeScope);

/* ===== LEDs ===== */

const FILTERS = {
  low: f => {
    const K = 1 + 560 / 1000, Q = 1 / (3 - K), x = 2 * Math.PI * f * 1e3 * 1e-6;
    return K / Math.hypot(1 - x * x, x / Q);
  },
  band: f => {
    const R1 = 22e3, R2 = 180e3, R3 = 60e3, C = 10e-9;
    const f0 = Math.sqrt((R1 + R2) / (R1 * R2 * R3)) / (2 * Math.PI * C);
    const Q = 0.5 * Math.sqrt((R3 * (R1 + R2)) / (R1 * R2)), A = R3 / (2 * R1);
    const r = f / f0 - f0 / f;
    return A / Math.sqrt(1 + Q * Q * r * r);
  },
  high: f => {
    const K = 1 + 560 / 1000, Q = 1 / (3 - K), x = 2 * Math.PI * f * 1e3 * 0.1e-6;
    return (K * x * x) / Math.hypot(1 - x * x, x / Q);
  },
};

const LEDS = [['d1', 'low', 1.8], ['d2', 'band', 2.2], ['d3', 'high', 3.0]].map(([id, filter, vf]) => {
  let lens = null, led = null;
  partById[id].group.traverse(o => {
    if (o.isMesh && o.material.userData.isLens) lens = o.material;
    if (o.userData.led) led = o.userData.led;
  });
  return { filter, vf, lens, ...led };
});

function ledCurrent(vp, vf) {
  let sum = 0;
  for (let i = 0; i < 240; i++) sum += Math.max(0, vp * Math.sin((2 * Math.PI * i) / 240) - vf) / 100;
  return sum / 240;
}

let genFreq = 90;

function updateLEDs() {
  LEDS.forEach(l => {
    const vp = powered ? GEN_VP * FILTERS[l.filter](genFreq) : 0;
    const b = 1 - Math.exp(-ledCurrent(vp, l.vf) / 0.0015);
    l.lens.emissiveIntensity = b * 2.1;
    l.halo.visible = b > 0.01;
    l.halo.material.opacity = b * 0.95;
    l.light.intensity = b * 2.6;
  });
  needsRender = true;
}

function setFreq(f) {
  genFreq = f;
  generator.userData.select(f);
  updateLEDs();
}

let powered = false;
const noteOff = document.getElementById('noteOff');

function setPower(on) {
  powered = on;
  supply.userData.setPower(on);
  noteOff.hidden = on;
  updateLEDs();
}

function warnOff() {
  noteOff.classList.remove('pulse');
  void noteOff.offsetWidth;
  noteOff.classList.add('pulse');
}

function pressButton(group) {
  group.position.z -= 0.035;
  needsRender = true;
  setTimeout(() => { group.position.z += 0.035; needsRender = true; }, 140);
}

/* ===== Piezas: información y vista explosionada ===== */

const info = {
  root: document.getElementById('info'),
  tag: document.getElementById('infoTag'),
  name: document.getElementById('infoName'),
  desc: document.getElementById('infoDesc'),
  tip: document.getElementById('infoTip'),
};
const btnExplode = document.getElementById('btnExplode');
let selected = null, hovered = null, exploded = false, explodeT = 99;
const lifted = PARTS.filter(p => p.explode > 0);
btnExplode.hidden = !lifted.length;

function setEmissive(part, intensity) {
  part.group.traverse(o => {
    if (!o.isMesh) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      if (!m.emissive || m.userData.keepEmissive) return;
      m.emissive.set(intensity ? '#2f6bff' : '#000000');
      m.emissiveIntensity = intensity;
    });
  });
}

let shownSel = null, shownHov = null;
function applyHighlight() {
  for (const id of new Set([shownSel, shownHov, selected, hovered])) {
    if (!id) continue;
    setEmissive(partById[id], id === selected ? 0.13 : id === hovered ? 0.06 : 0);
  }
  shownSel = selected;
  shownHov = hovered;
  needsRender = true;
}

function select(id) {
  if (id === selected) { if (id) armInfo(); return; }
  selected = id;
  applyHighlight();
  holdInfo();
  if (!id) { info.root.hidden = true; return; }
  const p = partById[id];
  info.tag.textContent = p.tag;
  info.name.textContent = p.name;
  info.desc.textContent = p.desc;
  info.tip.textContent = p.tip;
  info.tip.hidden = !p.tip;
  info.root.hidden = false;
  armInfo();
}

function setHover(id) {
  if (id === 'board') id = null;
  if (id === hovered) return;
  hovered = id;
  applyHighlight();
}

document.getElementById('infoClose').addEventListener('click', () => select(null));

const INFO_MS = 3000;
let infoTimer = 0;

function holdInfo() {
  clearTimeout(infoTimer);
  info.root.classList.remove('out');
}

function armInfo() {
  holdInfo();
  infoTimer = setTimeout(() => {
    info.root.classList.add('out');
    infoTimer = setTimeout(() => select(null), 250);
  }, INFO_MS);
}

info.root.addEventListener('pointerenter', holdInfo);
info.root.addEventListener('pointerleave', () => { if (!info.root.hidden) armInfo(); });

btnExplode.addEventListener('click', () => {
  exploded = !exploded;
  explodeT = 0;
  btnExplode.setAttribute('aria-pressed', String(exploded));
  btnExplode.textContent = exploded ? 'Volver a armar' : 'Vista explosionada';
});

function stepExplode(dt) {
  explodeT += dt;
  let moving = false;
  const k = 1 - Math.exp(-dt * 7);
  lifted.forEach((p, i) => {
    const delay = (exploded ? i : lifted.length - 1 - i) * 0.05;
    if (explodeT < delay) { moving = true; return; }
    const target = exploded ? p.explode : 0;
    const diff = target - p.group.position.y;
    if (Math.abs(diff) < 0.0005) { p.group.position.y = target; return; }
    p.group.position.y += diff * k;
    moving = true;
  });
  if (moving) sun.shadow.needsUpdate = true;
  return moving;
}

/* ===== Navegación ===== */

const sphA = new THREE.Spherical(), sphB = new THREE.Spherical(), sphC = new THREE.Spherical();
const tmpOff = new THREE.Vector3();
let fly = null;
let needsRender = true;

function flyTo(pos, target, dur = 0.9, mode = 'io') {
  fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: target.clone(), k: 0, dur, mode };
}

function stepFly(dt) {
  fly.k = Math.min(1, fly.k + dt / fly.dur);
  const k = fly.k;
  const e = fly.mode === 'out' ? 1 - Math.pow(1 - k, 4) : (k < 0.5 ? 4 * k ** 3 : 1 - Math.pow(-2 * k + 2, 3) / 2);
  controls.target.lerpVectors(fly.t0, fly.t1, e);
  sphA.setFromVector3(tmpOff.copy(fly.p0).sub(fly.t0));
  sphB.setFromVector3(tmpOff.copy(fly.p1).sub(fly.t1));
  let dTheta = sphB.theta - sphA.theta;
  while (dTheta > Math.PI) dTheta -= Math.PI * 2;
  while (dTheta < -Math.PI) dTheta += Math.PI * 2;
  sphC.set(
    THREE.MathUtils.lerp(sphA.radius, sphB.radius, e),
    THREE.MathUtils.lerp(sphA.phi, sphB.phi, e),
    sphA.theta + dTheta * e);
  camera.position.copy(controls.target).add(tmpOff.setFromSpherical(sphC));
  if (fly.k >= 1) fly = null;
}

controls.addEventListener('start', () => { fly = null; });
controls.addEventListener('change', () => { needsRender = true; });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const FOCUS_MIN = 2.2;

function pickPoint(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(scene.children, true)[0];
  return hit ? hit.point.clone() : null;
}

function focusAt(clientX, clientY, zoom) {
  const p = pickPoint(clientX, clientY);
  if (!p) return;
  const d = camera.position.distanceTo(controls.target);
  const dist = THREE.MathUtils.clamp(d * zoom, FOCUS_MIN, controls.maxDistance);
  const dir = camera.position.clone().sub(controls.target).normalize();
  flyTo(p.clone().addScaledVector(dir, dist), p, 0.55);
}

let down = null;
canvas.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, t: performance.now(), b: e.button };
  canvas.style.cursor = e.button === 0 ? 'grabbing' : 'move';
});
function scopeButtonAt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([...scope.userData.buttons, ...generator.userData.buttons, supply.userData.powerButton], true)[0];
  let o = hit ? hit.object : null;
  while (o && !o.userData.stage && !o.userData.power && !o.userData.freq) o = o.parent;
  return o;
}

function partAt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData.partId : null;
}

let hoverPending = null;
canvas.addEventListener('pointermove', e => {
  if (e.buttons || hoverPending) return;
  hoverPending = requestAnimationFrame(() => {
    hoverPending = null;
    const b = scopeButtonAt(e.clientX, e.clientY);
    const id = b ? null : partAt(e.clientX, e.clientY);
    setHover(id);
    canvas.style.cursor = b || (id && id !== 'board') ? 'pointer' : 'grab';
  });
});
canvas.addEventListener('pointerleave', () => setHover(null));

canvas.addEventListener('pointerup', e => {
  canvas.style.cursor = 'grab';
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  const quick = performance.now() - down.t < 350;
  if (moved < 6 && quick && down.b === 0) {
    const b = scopeButtonAt(e.clientX, e.clientY);
    if (b) {
      pressButton(b);
      if (b.userData.power) setPower(!powered);
      else if (b.userData.freq) setFreq(b.userData.freq);
      else if (!powered) warnOff();
      else if (STAGE_VIEW[b.userData.stage]) setTimeout(() => openScope(b.userData.stage), 160);
      down = null;
      return;
    }
    select(partAt(e.clientX, e.clientY));
  }
  if (moved < 6 && quick && down.b === 0) focusAt(e.clientX, e.clientY, 0.6);
  if (moved < 6 && quick && down.b === 2) focusAt(e.clientX, e.clientY, 1.6);
  down = null;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.style.cursor = 'grab';

addEventListener('keydown', e => {
  if (svStage) {
    if (e.key === 'Escape') closeScope();
    return;
  }
  if (e.key === 'Escape' && selected) {
    select(null);
    return;
  }
  if (e.key === 'Escape' || e.key === 'Home') flyTo(HOME.pos.clone(), HOME.target.clone(), 0.9);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  needsRender = true;
});

/* ===== Rendimiento ===== */

let pixR = PIX_MAX, frameAcc = 0, frameN = 0;
function adaptResolution(dt) {
  if (dt < 0.06 && document.visibilityState === 'visible') {
    frameAcc += dt;
    frameN++;
  }
  if (frameN < 40) return;
  const avg = frameAcc / frameN;
  frameAcc = 0;
  frameN = 0;
  if (avg > 0.028 && pixR > PIX_MIN) {
    pixR = Math.max(PIX_MIN, pixR - 0.25);
    renderer.setPixelRatio(pixR);
  } else if (avg < 0.0135 && pixR < PIX_MAX) {
    pixR = Math.min(PIX_MAX, pixR + 0.25);
    renderer.setPixelRatio(pixR);
  }
}

/* ===== Bucle principal ===== */

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (svStage) return;
  if (fly) stepFly(dt);
  if (stepExplode(dt)) needsRender = true;
  const expTarget = powered ? EXPOSURE.on : EXPOSURE.day;
  const expDiff = expTarget - renderer.toneMappingExposure;
  if (expDiff) {
    renderer.toneMappingExposure = Math.abs(expDiff) < 0.002 ? expTarget : renderer.toneMappingExposure + expDiff * (1 - Math.exp(-dt * 4));
    needsRender = true;
  }
  controls.update();
  if (!fly) clampTarget();
  if (!fly && !needsRender) return;
  needsRender = false;
  renderer.render(scene, camera);
  adaptResolution(dt);
}

setFreq(genFreq);
camera.position.set(HOME.pos.x + 5, HOME.pos.y * 1.45, HOME.pos.z * 1.3);
flyTo(HOME.pos.clone(), HOME.target.clone(), 2.2, 'out');
animate();
document.getElementById('loading').hidden = true;</script>
